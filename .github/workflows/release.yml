name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set release version
        id: version
        run: |
          CURRENT_VERSION=$(sed -nE 's/^ \* Version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' dmbc-tools.php)
          test -n "$CURRENT_VERSION"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i -E "s/^ \* Version: .*/ * Version: ${VERSION}/" dmbc-tools.php
          sed -i -E "s/(public const string VERSION[[:space:]]*=[[:space:]]*')[^']+('.*)/\1${VERSION}\2/" src/plugin.php
          sed -i -E "s/^Stable tag: .*/Stable tag: ${VERSION}/" readme.txt

          grep -F "Version: $VERSION" dmbc-tools.php
          grep -F "public const string VERSION" src/plugin.php | grep -F "'$VERSION'"
          grep -F "Stable tag: $VERSION" readme.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dmbc-tools.php src/plugin.php readme.txt
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main "v${VERSION}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-progress --prefer-dist --no-interaction

      - name: Create plugin artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_DIR="$RUNNER_TEMP/dmbc-tools"
          mkdir "$PACKAGE_DIR"
          rsync -a ./ "$PACKAGE_DIR/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.phpunit.cache/' \
            --exclude='tests/' \
            --exclude='.wp-env.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml' \
            --exclude='phpunit.xml'
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/dmbc-tools-${VERSION}.zip" "dmbc-tools"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: dmbc-tools-${{ steps.version.outputs.version }}
          path: dmbc-tools-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dmbc-tools-${{ steps.version.outputs.version }}.zip
