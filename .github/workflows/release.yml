name: Release

on:
  workflow_run:
    workflows:
      - Build and Test
    types:
      - completed

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set release version
        env:
          VERSION_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${VERSION_TAG#v}"
          test -n "$VERSION"
          sed -i -E "s/^ \* Version: .*/ * Version: ${VERSION}/" dmbc-tools.php
          sed -i -E "s/(public const string VERSION[[:space:]]*=[[:space:]]*')[^']+('.*)/\1${VERSION}\2/" src/plugin.php
          sed -i -E "s/^Stable tag: .*/Stable tag: ${VERSION}/" readme.txt
          sed -i -E "s/^=[[:space:]]*0\.1\.0[[:space:]]*=$/= ${VERSION} =/" readme.txt
          grep -F "Version: $VERSION" dmbc-tools.php
          grep -F "public const string VERSION" src/plugin.php | grep -F "'$VERSION'"
          grep -F "Stable tag: $VERSION" readme.txt

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-progress --prefer-dist --no-interaction

      - name: Create plugin artifact
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          PACKAGE_DIR="$RUNNER_TEMP/dmbc-tools-${VERSION#v}"
          mkdir "$PACKAGE_DIR"
          rsync -a ./ "$PACKAGE_DIR/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.phpunit.cache/' \
            --exclude='tests/' \
            --exclude='.wp-env.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml' \
            --exclude='phpunit.xml'
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/dmbc-tools-${VERSION#v}.zip" "dmbc-tools-${VERSION#v}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: dmbc-tools-${{ github.event.workflow_run.head_branch }}
          path: dmbc-tools-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: DMBC Tools ${{ github.event.workflow_run.head_branch }}
          generate_release_notes: true
          files: dmbc-tools-*.zip
