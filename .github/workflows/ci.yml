name: Build and Test

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}

        
    strategy:
      matrix:
        # Define the exact PHP versions you want to test
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check for an open pull request
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('run', 'true');
              return;
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
            });
            core.setOutput('run', pullRequests.length === 0 ? 'true' : 'false');

  test:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Set up PHP for Composer checks
        uses: shivammathur/setup-php@v2
        with:
          php-version:  ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Verify Composer vendor directory
        run: test -f vendor/autoload.php

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: composer lint

      - name: Install wp-env
        run: npm install --global @wordpress/env

      - name: Start WordPress test environment
        # 2. Pin to WordPress 7.1.0 temporarily until the 7.1.1 Git tag sync bug is resolved
        run: wp-env start --xdebug=coverage --update --core="WordPress/WordPress#7.1.0"

      - name: Run PHPUnit in WordPress test container
        # 3. Wrapping the execution inside bash -c forces the inner container's shell to catch
        # and throw a clean, non-zero exit status code that GitHub Actions can register.
        run: |
          wp-env run tests-cli --env-cwd=wp-content/plugins/dmbc-tools bash -e -c "vendor/bin/phpunit --colors=never"

      - name: Run PHPUnit with Coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          wp-env run tests-cli --env-cwd=wp-content/plugins/dmbc-tools bash -e -c "XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover coverage.xml"

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      # This step attaches the generated markdown to your Workflow Run summary
      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
        if: false

      - name: Stop WordPress test environment
        if: always()
        run: wp-env stop
