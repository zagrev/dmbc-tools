name: Build and Test

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - name: Check for an open pull request
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('run', 'true');
              return;
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
            });
            core.setOutput('run', pullRequests.length === 0 ? 'true' : 'false');

  test:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # 1. Downgrade to Node 22 LTS to fix the silent wp-env crash bug

      - name: Set up PHP for Composer checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Verify Composer vendor directory
        run: test -f vendor/autoload.php

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: composer lint

      - name: Install wp-env
        run: npm install --global @wordpress/env

      - name: Start WordPress test environment
        # 2. Pin to WordPress 7.1.0 temporarily until the 7.1.1 Git tag sync bug is resolved
        run: wp-env start --update --core="WordPress/WordPress#7.1.0"

      - name: Run PHPUnit in WordPress test container
        # 3. Wrapping the execution inside bash -c forces the inner container's shell to catch
        # and throw a clean, non-zero exit status code that GitHub Actions can register.
        run: |
          wp-env run tests-cli --env-cwd=wp-content/plugins/dmbc-tools bash -c "vendor/bin/phpunit --colors=never"

      - name: Stop WordPress test environment
        if: always()
        run: wp-env stop
