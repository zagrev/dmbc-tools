name: Build and Test

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up PHP for Composer checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Verify Composer vendor directory
        run: test -f vendor/autoload.php

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: composer lint

      - name: Install wp-env
        run: npm install --global @wordpress/env

      - name: Start WordPress test environment
        run: wp-env start --update

      - name: Run PHPUnit in WordPress test container
        run: wp-env run tests-cli --env-cwd=wp-content/plugins/dmbc-tools vendor/bin/phpunit --colors=never

      - name: Stop WordPress test environment
        if: always()
        run: wp-env stop
